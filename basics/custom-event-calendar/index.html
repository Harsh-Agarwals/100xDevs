<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Calendar</title>
    <meta name="author" content="Harsh Agarwal">
    <meta name="description" content="Calendar app where you can specify events">

    <link href="styles.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="scripts.js" defer></script>
</head>
<body>

    <div class="calendar">
        <div class="bg">
            <div class="heading">
                <p class="name">Harsh</p>
                <span>
                    <i class="fa-solid fa-user"></i>
                </span>
            </div>
            <hr class="hr">
            <div class="selectMonth">
                <select name="month" id="month">
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
            </div>
            <hr class="hr">
            <div class="dates"></div>
        </div>

        <div class="desc hidden">
            <div class="cut">
                <i class="fa-solid fa-x"></i>
            </div>
            <p class="selectedDay">January 1</p>
            <p class="event">Event List</p>
            <hr class="hr2">
            <ul class="events">
            </ul>
            <hr class="hr3">
            <div class="new">
                <p class="addNew">Add new</p>
                <div class="write">
                    <form action="" class="inputForm">
                        <input type="text" name="newEvent" id="newEvent">
                        <input type="submit" value="ADD" class="submit">
                    </form>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
